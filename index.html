<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D 产品交互预览 · HDR 环境与 UV 清漆</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 38%, #1d2230 0%, #0b0e14 100%);
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    .glass {
      background: rgba(15, 20, 30, 0.80);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    #color-wheel {
      touch-action: none;
      cursor: crosshair;
    }
    .thin-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 9999px; }
  </style>
</head>
<body class="select-none">

  <!-- 3D 渲染画布 -->
  <div id="canvas-container"></div>

  <!-- 顶部导航与常驻零件状态栏 -->
  <header class="fixed top-0 left-0 right-0 z-20 p-3 sm:p-4 flex flex-col gap-2 pointer-events-none">
    <div class="flex items-center justify-between gap-2">
      <div class="glass rounded-2xl px-3.5 py-2 flex items-center gap-2.5 pointer-events-auto shadow-lg max-w-[54vw] sm:max-w-md">
        <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse shrink-0"></div>
        <div class="min-w-0">
          <h1 id="model-title" class="text-xs sm:text-sm font-semibold tracking-wide text-white truncate">8600.glb</h1>
          <p id="model-subtitle" class="text-[11px] text-slate-400 truncate">HDR 物理环境 · 正在加载模型...</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto">


        <button id="btn-autorotate" type="button" title="自动旋转" class="glass hover:bg-white/15 active:scale-95 transition rounded-xl p-2 text-slate-300 shadow-lg">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M5.64 17.36A9 9 0 0019.95 13M18.36 6.64A9 9 0 004.05 11"/></svg>
        </button>

        <button id="btn-reset-view" type="button" title="重置视角" class="glass hover:bg-white/15 active:scale-95 transition rounded-xl p-2 text-slate-300 shadow-lg">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        </button>
      </div>
    </div>

    <!-- 常驻显示：自动换行的完整零件颜色圆点与材质方案栏 -->
    <div class="pointer-events-auto flex flex-col gap-1.5 max-w-2xl">
      <div id="parts-status-bar" class="flex flex-wrap items-center gap-1.5 max-h-24 overflow-y-auto thin-scroll pr-1">
        <!-- JS 动态渲染所有零件圆点与材质标签 -->
      </div>
      <button id="btn-toggle-parts" type="button" class="hidden self-start glass rounded-full px-2.5 py-0.5 text-[10px] text-cyan-300 hover:bg-white/10 transition">
        展开全部零件
      </button>
    </div>
  </header>

  <!-- 模型加载进度条 -->
  <div id="loading-overlay" class="fixed inset-0 z-40 flex items-center justify-center bg-slate-950/65 backdrop-blur-sm px-6 transition-opacity duration-300">
    <div class="glass rounded-2xl p-5 w-full max-w-xs shadow-2xl">
      <div class="flex items-center justify-between text-xs mb-2.5">
        <span class="font-semibold text-white truncate">正在加载 8600.glb</span>
        <span id="loading-percent" class="font-mono text-cyan-300 shrink-0">0%</span>
      </div>
      <div class="w-full h-2 rounded-full bg-white/10 overflow-hidden">
        <div id="loading-bar" class="h-full w-0 rounded-full bg-gradient-to-r from-cyan-400 to-sky-500 transition-all duration-150"></div>
      </div>
      <p id="loading-detail" class="text-[11px] text-slate-400 mt-2">正在请求线上模型文件...</p>
    </div>
  </div>

  <!-- 零件点击高亮弹窗：仅显示 3D 文件中的零件名称 -->
  <aside id="part-popup" class="fixed z-30 left-1/2 -translate-x-1/2 bottom-44 sm:bottom-44 glass rounded-2xl px-4 py-2 shadow-2xl transition-all duration-200 opacity-0 translate-y-3 pointer-events-none flex items-center gap-2.5 max-w-[90vw]">
    <span class="w-2 h-2 rounded-full bg-cyan-400 shrink-0"></span>
    <h2 id="popup-part-name" class="text-sm font-semibold text-white truncate">零件名称</h2>
    <button id="btn-close-popup" type="button" class="text-slate-400 hover:text-white p-0.5 rounded-lg shrink-0">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </aside>

  <!-- 底部：仅针对选中零件的色环与五种材质质感方案 -->
  <footer class="fixed bottom-0 left-0 right-0 z-20 p-3 sm:p-4 pointer-events-none flex justify-center">
    <div class="glass rounded-2xl p-3 w-full max-w-md pointer-events-auto shadow-2xl flex items-center gap-3.5">
      <div class="relative shrink-0 w-24 h-24 sm:w-28 sm:h-28">
        <canvas id="color-wheel" width="224" height="224" class="w-full h-full rounded-full"></canvas>
        <div id="wheel-cursor" class="absolute w-3.5 h-3.5 rounded-full border-2 border-white shadow-md pointer-events-none -translate-x-1/2 -translate-y-1/2 hidden" style="left: 50%; top: 50%;"></div>
      </div>

      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-2 mb-2">
          <span class="text-xs font-semibold text-slate-200 truncate">选中零件材质方案</span>
          <div class="flex items-center gap-1.5 shrink-0">
            <span id="picked-color-dot" class="w-3.5 h-3.5 rounded-full border border-white/30 bg-slate-400"></span>
            <span id="picked-color-hex" class="text-[11px] font-mono text-slate-300">#38BDF8</span>
          </div>
        </div>

        <div id="finish-buttons" class="grid grid-cols-3 gap-1.5">
          <!-- JS 动态渲染五种质感按钮 -->
        </div>
      </div>
    </div>
  </footer>

  <!-- Toast 提示 -->
  <div id="toast" class="fixed top-32 left-1/2 -translate-x-1/2 z-50 glass px-4 py-2 rounded-full text-xs text-white shadow-xl opacity-0 pointer-events-none transition-opacity duration-200"></div>

      camera.position.set(3.2, 2.2, 3.8);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;

      // 加载用户上传的 abandoned_slipway_4k.hdr (已优化为 512px 轻量 HDRI 供 PMREM 物理反射)
      function initHdrEnvironment() {
        const pmrem = new THREE.PMREMGenerator(renderer);
        pmrem.compileEquirectangularShader();

        if (typeof THREE.RGBELoader === 'function') {
          const rgbeLoader = new THREE.RGBELoader();
          rgbeLoader.setDataType(THREE.UnsignedByteType);
          rgbeLoader.load(
            EMBEDDED_HDR_DATA_URI,
            (hdrTex) => {
              const envRT = pmrem.fromEquirectangular(hdrTex);
              scene.environment = envRT.texture;
              hdrTex.dispose();
              pmrem.dispose();
            },
            undefined,
            () => {
              pmrem.dispose();
            }
          );
        } else {
          pmrem.dispose();
        }
      }
      initHdrEnvironment();

      // 磨砂微颗粒凹凸贴图
      function createFrostedBumpMap() {
        const size = 256;
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const ctx = c.getContext('2d');
        const img = ctx.createImageData(size, size);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = 110 + Math.floor(Math.random() * 36);
          img.data[i] = v;
          img.data[i + 1] = v;
          img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(6, 6);
        return tex;
      }
      const frostedBumpMap = createFrostedBumpMap();

      function drawColorWheel() {
        const ctx = wheelCanvas.getContext('2d');
        const w = wheelCanvas.width;
        const h = wheelCanvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const radius = w / 2 - 2;
        const img = ctx.createImageData(w, h);
        const data = img.data;

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const dx = x - cx;
            const dy = y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const idx = (y * w + x) * 4;
            if (dist <= radius) {
              const hue = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
              const sat = Math.min(dist / radius, 1);
              const [r, g, b] = hsvToRgb(hue, sat, 1.0);
              data[idx] = r;
              data[idx + 1] = g;
              data[idx + 2] = b;
              data[idx + 3] = 255;
            } else {
              data[idx + 3] = 0;
            }
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      function hsvToRgb(h, s, v) {
        const c = v * s;
        const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
        const m = v - c;
        let r = 0, g = 0, b = 0;
        if (h < 60) { r = c; g = x; }
        else if (h < 120) { r = x; g = c; }
        else if (h < 180) { g = c; b = x; }
        else if (h < 240) { g = x; b = c; }
        else if (h < 300) { r = x; b = c; }
        else { r = c; b = x; }
        return [
          Math.round((r + m) * 255),
          Math.round((g + m) * 255),
          Math.round((b + m) * 255),
        ];
      }

      function rgbToHex(r, g, b) {
        return '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('').toUpperCase();
      }

      function pickColorFromWheel(clientX, clientY) {
        const rect = wheelCanvas.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const radius = rect.width / 2 - 2;
        let dx = (clientX - rect.left) - cx;
        let dy = (clientY - rect.top) - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > radius) {
          dx = (dx / dist) * radius;
          dy = (dy / dist) * radius;
        }

        wheelCursor.style.left = `${((cx + dx) / rect.width) * 100}%`;
        wheelCursor.style.top = `${((cy + dy) / rect.height) * 100}%`;
        wheelCursor.classList.remove('hidden');

        const hue = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
        const sat = Math.min(Math.sqrt(dx * dx + dy * dy) / radius, 1);
        const [r, g, b] = hsvToRgb(hue, sat, 1.0);
        const hex = rgbToHex(r, g, b);

        state.currentColorHex = hex;
        pickedDot.style.backgroundColor = hex;
        pickedHex.textContent = hex;

        if (state.selectedMesh) {
          state.selectedMesh.userData.hasCustomColor = true;
        }
        if (state.activeFinishId === 'original') {
          state.activeFinishId = 'electroplate';
          renderFinishButtons();
        }
        applySelectedPartMaterial();
      }

      let isPickingWheel = false;
      wheelCanvas.addEventListener('pointerdown', (e) => {
        isPickingWheel = true;
        wheelCanvas.setPointerCapture(e.pointerId);
        pickColorFromWheel(e.clientX, e.clientY);
      });
      wheelCanvas.addEventListener('pointermove', (e) => {
        if (isPickingWheel) pickColorFromWheel(e.clientX, e.clientY);
      });
      wheelCanvas.addEventListener('pointerup', () => { isPickingWheel = false; });
      wheelCanvas.addEventListener('pointercancel', () => { isPickingWheel = false; });

      function ensurePhysicalMaterial(mat) {
        if (mat && mat.isMeshPhysicalMaterial) return mat;
        return new THREE.MeshPhysicalMaterial({
          color: mat && mat.color ? mat.color.clone() : new THREE.Color(0x94a3b8),
          metalness: mat && typeof mat.metalness === 'number' ? mat.metalness : 0.3,
          roughness: mat && typeof mat.roughness === 'number' ? mat.roughness : 0.4,
          map: mat ? mat.map || null : null,
          normalMap: mat ? mat.normalMap || null : null,
          roughnessMap: mat ? mat.roughnessMap || null : null,
          metalnessMap: mat ? mat.metalnessMap || null : null,
        });
      }

      function applySelectedPartMaterial() {
        const mesh = state.selectedMesh;
        if (!mesh) {
          showToast('请先点击模型上的任意零件');
          return;
        }
        const preset = FINISH_PRESETS.find((f) => f.id === state.activeFinishId) || FINISH_PRESETS[0];
        const isArray = Array.isArray(mesh.material);
        const mats = isArray ? mesh.material : [mesh.material];
        const orig = mesh.userData.origMatState || [];

        const updated = mats.map((m, i) => {
          const pm = ensurePhysicalMaterial(m);
          const o = orig[i] || {};

          if (preset.isOriginal) {
            if (o.color !== undefined) pm.color.setHex(o.color);
            pm.metalness = o.metalness !== undefined ? o.metalness : 0.3;
            pm.roughness = o.roughness !== undefined ? o.roughness : 0.5;
            pm.clearcoat = o.clearcoat || 0.0;
            pm.clearcoatRoughness = o.clearcoatRoughness || 0.0;
            pm.envMapIntensity = 0.9;
            pm.map = o.map || null;
            pm.roughnessMap = o.roughnessMap || null;
            pm.metalnessMap = o.metalnessMap || null;
            pm.bumpMap = o.bumpMap || null;
            pm.bumpScale = o.bumpScale || 0.0;
          } else if (preset.isUvClearcoat) {
            // UV亮面：若已在色环选色则使用所选颜色，否则保留本色；并叠加高光 UV 清漆层
            if (mesh.userData.hasCustomColor) {
              pm.color.set(state.currentColorHex);
              pm.map = null;
              pm.roughnessMap = null;
              pm.metalnessMap = null;
            } else {
              if (o.color !== undefined) pm.color.setHex(o.color);
              pm.map = o.map || null;
              pm.roughnessMap = o.roughnessMap || null;
              pm.metalnessMap = o.metalnessMap || null;
            }
            pm.metalness = o.metalness !== undefined ? Math.min(o.metalness, 0.25) : 0.12;
            pm.roughness = 0.18;
            pm.clearcoat = preset.clearcoat;
            pm.clearcoatRoughness = preset.clearcoatRoughness;
            pm.envMapIntensity = preset.envMapIntensity;
            pm.bumpMap = null;
            pm.bumpScale = 0.0;
          } else {
            pm.color.set(state.currentColorHex);
            pm.metalness = preset.metalness;
            pm.roughness = preset.roughness;
            pm.clearcoat = preset.clearcoat;
            pm.clearcoatRoughness = preset.clearcoatRoughness;
            pm.envMapIntensity = preset.envMapIntensity;
            pm.map = null;
            pm.roughnessMap = null;
            pm.metalnessMap = null;
            if (preset.bumpScale > 0) {
              pm.bumpMap = frostedBumpMap;
              pm.bumpScale = preset.bumpScale;
            } else {
              pm.bumpMap = null;
              pm.bumpScale = 0.0;
            }
          }
          pm.emissive.setHex(0x06b6d4);
          pm.emissiveIntensity = 0.30;
          pm.needsUpdate = true;
          return pm;
        });

        mesh.material = isArray ? updated : updated[0];

        if (preset.isOriginal) {
          mesh.userData.hasCustomColor = false;
          const firstOrig = orig[0] || { color: 0x94a3b8 };
          mesh.userData.currentColorHex = '#' + firstOrig.color.toString(16).padStart(6, '0').toUpperCase();
          mesh.userData.currentFinishLabel = mesh.userData.origFinishLabel || '原色';
        } else if (preset.isUvClearcoat && !mesh.userData.hasCustomColor) {
          const firstOrig = orig[0] || { color: 0x94a3b8 };
          mesh.userData.currentColorHex = '#' + firstOrig.color.toString(16).padStart(6, '0').toUpperCase();
          mesh.userData.currentFinishLabel = preset.name;
        } else {
          mesh.userData.currentColorHex = state.currentColorHex;
          mesh.userData.currentFinishLabel = preset.name;
        }
        renderPartsStatusBar();
      }

      function renderFinishButtons() {
        const wrap = document.getElementById('finish-buttons');
        wrap.innerHTML = '';
        FINISH_PRESETS.forEach((f) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          const active = state.activeFinishId === f.id;
          btn.className = `px-2 py-1.5 rounded-xl border text-[11px] sm:text-xs transition active:scale-95 ${
            active ? 'border-cyan-400 bg-cyan-500/20 text-white font-semibold' : 'border-white/10 bg-white/5 text-slate-300 hover:bg-white/10'
          }`;
          btn.textContent = f.name;
          btn.addEventListener('click', () => {
            state.activeFinishId = f.id;
            renderFinishButtons();
            applySelectedPartMaterial();
          });
          wrap.appendChild(btn);
        });
      }

      function captureMatState(mat) {
        const list = Array.isArray(mat) ? mat : [mat];
        return list.map((m) => ({
          color: m.color ? m.color.getHex() : 0xffffff,
          metalness: typeof m.metalness === 'number' ? m.metalness : 0.2,
          roughness: typeof m.roughness === 'number' ? m.roughness : 0.5,
          clearcoat: typeof m.clearcoat === 'number' ? m.clearcoat : 0.0,
          clearcoatRoughness: typeof m.clearcoatRoughness === 'number' ? m.clearcoatRoughness : 0.0,
          map: m.map || null,
          roughnessMap: m.roughnessMap || null,
          metalnessMap: m.metalnessMap || null,
          bumpMap: m.bumpMap || null,
          bumpScale: m.bumpScale || 0.0,
        }));
      }

      function resetCameraView() {
        camera.position.set(2.8, 1.9, 3.3);
        controls.target.set(0, 0, 0);
        controls.update();
      }

      function registerModel(root, title) {
        if (state.modelRoot) scene.remove(state.modelRoot);
        clearSelection();
        state.meshes = [];
        state.partsExpanded = false;
        partsStatusBar.classList.add('max-h-24');
        partsStatusBar.classList.remove('max-h-[45vh]');
        state.modelRoot = root;

        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z, 0.001);
        const scale = 2.2 / maxDim;

        root.scale.setScalar(scale);
        root.position.sub(center.multiplyScalar(scale));

        const scaledBox = new THREE.Box3().setFromObject(root);
        studioFloor.position.y = scaledBox.min.y - 0.005;

        let idx = 1;
        root.traverse((child) => {
          if (child.isMesh) {
            if (!child.name) child.name = 'Part_' + idx;
            idx++;
            child.castShadow = true;
            child.receiveShadow = true;

            if (Array.isArray(child.material)) {
              child.material = child.material.map((m) => ensurePhysicalMaterial(m.clone()));
            } else if (child.material) {
              child.material = ensurePhysicalMaterial(child.material.clone());
            } else {
              child.material = new THREE.MeshPhysicalMaterial({ color: 0x94a3b8, metalness: 0.4, roughness: 0.4 });
            }
            if (Array.isArray(child.material)) {
              child.material.forEach((m) => { m.envMapIntensity = 0.9; });
            } else {
              child.material.envMapIntensity = 0.9;
            }
            const orig = captureMatState(child.material);
            child.userData.origMatState = orig;
            const firstColor = (orig[0] && orig[0].color !== undefined) ? orig[0].color : 0x94a3b8;
            child.userData.currentColorHex = '#' + firstColor.toString(16).padStart(6, '0').toUpperCase();
            child.userData.origFinishLabel = child.userData.origFinishLabel || '原色';
            child.userData.currentFinishLabel = child.userData.origFinishLabel;
            state.meshes.push(child);
          }
        });

        scene.add(root);
        modelTitleEl.textContent = title;
        modelSubtitleEl.textContent = `HDR 物理环境 · 共 ${state.meshes.length} 个零件`;
        renderPartsStatusBar();
        resetCameraView();
      }

      function buildDemoProduct() {
        const group = new THREE.Group();
        const parts = [
          { name: 'Top_Housing', finish: '金属哑面', geo: new THREE.CylinderGeometry(0.95, 1.0, 0.28, 48), pos: [0, 0.52, 0], mat: new THREE.MeshPhysicalMaterial({ color: 0x94a3b8, metalness: 0.88, roughness: 0.42 }) },
          { name: 'Optics_Lens', finish: 'UV亮面', geo: new THREE.CylinderGeometry(0.45, 0.45, 0.16, 40), pos: [0, 0.68, 0], mat: new THREE.MeshPhysicalMaterial({ color: 0x0ea5e9, metalness: 0.1, roughness: 0.18, clearcoat: 1.0, clearcoatRoughness: 0.03 }) },
          { name: 'Main_PCB', finish: '哑光磨砂', geo: new THREE.CylinderGeometry(0.84, 0.84, 0.09, 36), pos: [0, 0.22, 0], mat: new THREE.MeshPhysicalMaterial({ color: 0x0f766e, metalness: 0.0, roughness: 0.88 }) },
          { name: 'Heatsink_Core', finish: '电镀质感', geo: new THREE.CylinderGeometry(0.88, 0.92, 0.38, 48), pos: [0, -0.10, 0], mat: new THREE.MeshPhysicalMaterial({ color: 0x64748b, metalness: 1.0, roughness: 0.06, clearcoat: 0.25 }) },
          { name: 'Base_Chassis', finish: '哑光磨砂', geo: new THREE.CylinderGeometry(0.96, 0.90, 0.22, 48), pos: [0, -0.46, 0], mat: new THREE.MeshPhysicalMaterial({ color: 0x1e293b, metalness: 0.0, roughness: 0.88 }) },

      function setMeshHighlight(mesh, active) {
        if (!mesh) return;
        const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
        mats.forEach((m) => {
          if (m.emissive) {
            m.emissive.setHex(active ? 0x06b6d4 : 0x000000);
            m.emissiveIntensity = active ? 0.30 : 0.0;
          }
        });
      }

      function clearSelection() {
        if (state.selectedMesh) {
          setMeshHighlight(state.selectedMesh, false);
          state.selectedMesh = null;
        }
        popupEl.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
        renderPartsStatusBar();
      }

      function selectMesh(mesh) {
        if (state.selectedMesh === mesh) return;
        if (state.selectedMesh) setMeshHighlight(state.selectedMesh, false);
        state.selectedMesh = mesh;
        setMeshHighlight(mesh, true);

        document.getElementById('popup-part-name').textContent = mesh.name || 'Unnamed_Part';
        popupEl.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
        renderPartsStatusBar();
      }

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let downPos = { x: 0, y: 0 };

      renderer.domElement.addEventListener('pointerdown', (e) => {
        downPos = { x: e.clientX, y: e.clientY };
      });
      renderer.domElement.addEventListener('pointerup', (e) => {
        if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 6) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(state.meshes, false);
        if (hits.length > 0) selectMesh(hits[0].object);
        else clearSelection();
      });

      const dracoLoader = new THREE.DRACOLoader();
      dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
      const gltfLoader = new THREE.GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);

      const DEFAULT_MODEL_NAME = '8600.glb';
      const DEFAULT_GLB_URL = 'https://github.com/l262442016-stack/3d-preview/blob/4a1d8584f4b7a40e856f42d252c023a62340edb0/8600.glb';
      const EXPECTED_FILE_SIZE = 3620836;

      const loadingOverlay = document.getElementById('loading-overlay');
      const loadingBar = document.getElementById('loading-bar');
      const loadingPercent = document.getElementById('loading-percent');
      const loadingDetail = document.getElementById('loading-detail');

      function hideLoadingOverlay() {
        loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => loadingOverlay.classList.add('hidden'), 300);
      }

      function loadDefaultGlb() {
        gltfLoader.load(
          DEFAULT_GLB_URL,
          (gltf) => {
            loadingBar.style.width = '100%';
            loadingPercent.textContent = '100%';
            registerModel(gltf.scene, DEFAULT_MODEL_NAME);
            hideLoadingOverlay();
            showToast('模型加载成功，点击零件即可高亮');
          },
          (xhr) => {
            const total = xhr.total || EXPECTED_FILE_SIZE;
            if (total > 0 && xhr.loaded > 0) {
              const pct = Math.min(99, Math.round((xhr.loaded / total) * 100));
              loadingBar.style.width = `${pct}%`;
              loadingPercent.textContent = `${pct}%`;
              loadingDetail.textContent = `已下载 ${(xhr.loaded / 1048576).toFixed(2)} MB / ${(total / 1048576).toFixed(2)} MB`;
            }
          },
          (err) => {
            console.error('GLB 加载失败（可能受 Google Drive CORS 跨域限制）:', err);
            hideLoadingOverlay();
            buildDemoProduct();
            modelTitleEl.textContent = DEFAULT_MODEL_NAME;
            showToast('线上模型跨域受限，已切换示例组件预览');
          }
        );
      }

      document.getElementById('btn-close-popup').addEventListener('click', clearSelection);
      document.getElementById('btn-reset-view').addEventListener('click', resetCameraView);
      document.getElementById('btn-autorotate').addEventListener('click', (e) => {
        state.autoRotate = !state.autoRotate;
        controls.autoRotate = state.autoRotate;
        controls.autoRotateSpeed = 2.0;
        e.currentTarget.classList.toggle('text-cyan-300', state.autoRotate);
        showToast(state.autoRotate ? '已开启自动旋转' : '已暂停自动旋转');
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      drawColorWheel();
      renderFinishButtons();
      loadDefaultGlb();
      animate();
    })();
  </script>
</body>
</html>
